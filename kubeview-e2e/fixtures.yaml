# Deterministic cluster fixtures the E2E specs assert against. Names are
# stable (unlike deployment-managed pod names) so tests can target them
# directly. busybox is tiny, keeping image pulls fast in CI.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-logger
  namespace: e2e-demo
  labels:
    app: e2e-logger
    # Distinctive value so the pod-detail Labels section can be asserted
    # without colliding with other UI text.
    tier: e2e-fixture-label
spec:
  containers:
    - name: logger
      image: busybox:1.36
      # Emits a known marker line so the logs view has something to assert on.
      command: ["sh", "-c", "while true; do echo E2E_LOG_LINE_MARKER; sleep 2; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-multi
  namespace: e2e-demo
  labels:
    app: e2e-multi
spec:
  containers:
    # Each container emits a distinct marker so the logs view can be asserted
    # per-container — this is what actually guards the multi-container log
    # fix (#4/#6): selecting a container must show that container's output.
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo E2E_MAIN_MARKER; sleep 2; done"]
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo E2E_SIDECAR_MARKER; sleep 2; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-web
  namespace: e2e-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-web
  template:
    metadata:
      labels:
        app: e2e-web
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-svc
  namespace: e2e-demo
spec:
  selector:
    app: e2e-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-config
  namespace: e2e-demo
data:
  greeting: hello-from-e2e
  log-level: debug
---
apiVersion: v1
kind: Secret
metadata:
  name: e2e-secret
  namespace: e2e-demo
type: Opaque
# Keep the value lengths (8 and 15 bytes) in sync with secrets.spec.ts.
stringData:
  username: e2e-user
  password: sup3r-s3cret-pw
---
# Host-only rule with no http section — valid per the API, and a regression
# guard: transforming it used to nil-panic the backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: e2e-ing-hostonly
  namespace: e2e-demo
spec:
  rules:
    - host: hostonly.e2e.local
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: e2e-ing-paths
  namespace: e2e-demo
spec:
  rules:
    - host: e2e.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: e2e-svc
                port:
                  number: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: e2e-db
  namespace: e2e-demo
spec:
  serviceName: e2e-db-hl
  replicas: 1
  selector:
    matchLabels:
      app: e2e-db
  template:
    metadata:
      labels:
        app: e2e-db
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: e2e-agent
  namespace: e2e-demo
spec:
  selector:
    matchLabels:
      app: e2e-agent
  template:
    metadata:
      labels:
        app: e2e-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
